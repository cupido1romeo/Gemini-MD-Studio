<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Markdown Studio</title>
    <!-- PrismJS Theme (Tomorrow Night for dark mode) -->
    <link id="prism-theme" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gray: {
                50: '#f9fafb',
                100: '#f3f4f6',
                200: '#e5e7eb',
                300: '#d1d5db',
                400: '#9ca3af',
                500: '#6b7280',
                600: '#4b5563',
                700: '#374151',
                750: '#2d3748',
                800: '#1f2937',
                850: '#1a202c',
                900: '#111827',
                950: '#030712',
              }
            },
            typography: (theme) => ({
              DEFAULT: {
                css: {
                  color: theme('colors.gray.300'),
                  a: {
                    color: theme('colors.blue.400'),
                    '&:hover': {
                      color: theme('colors.blue.300'),
                    },
                  },
                  h1: { color: theme('colors.white') },
                  h2: { color: theme('colors.white') },
                  h3: { color: theme('colors.white') },
                  h4: { color: theme('colors.white') },
                  code: { color: theme('colors.pink.400') },
                  strong: { color: theme('colors.white') },
                  blockquote: { color: theme('colors.gray.400') },
                },
              },
              light: {
                css: {
                  color: theme('colors.gray.800'),
                  a: {
                    color: theme('colors.blue.600'),
                    '&:hover': {
                      color: theme('colors.blue.800'),
                    },
                  },
                  h1: { color: theme('colors.gray.900') },
                  h2: { color: theme('colors.gray.900') },
                  h3: { color: theme('colors.gray.900') },
                  h4: { color: theme('colors.gray.900') },
                  code: { color: theme('colors.pink.600') },
                  strong: { color: theme('colors.gray.900') },
                  blockquote: { color: theme('colors.gray.600') },
                },
              },
            }),
          },
        },
      }
    </script>
    <style>
      /* Custom scrollbar for a cleaner look */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #4a5568; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #718096; 
      }
      body {
        background-color: #1a202c;
        color: #e2e8f0;
      }
      
      /* Editor specific overrides to match theme */
      .editor-container pre, .editor-container code {
        background: transparent !important; /* Let existing bg shine through */
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace !important;
        text-shadow: none !important;
      }
      .editor-container textarea {
        outline: none !important;
      }
    </style>
    <!-- PrismJS Scripts (Global scope to ensure languages are registered) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markdown.min.js"></script>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
    "remark-gfm": "https://aistudiocdn.com/remark-gfm@^4.0.1",
    "vite": "https://aistudiocdn.com/vite@^7.2.6",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "react-simple-code-editor": "https://aistudiocdn.com/react-simple-code-editor@^0.14.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
